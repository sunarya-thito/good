# Runs the analyzer and the test suites on every push and pull request.
#
# packages/goo2d/example is here too, and not as a courtesy: the demos are the
# worked examples the docs point at, so that suite is the closest thing to an
# integration test the repository has. It sat in nobody's baseline and rotted to
# sixteen red tests before anyone noticed (#83), which is what this is for.
#
# The box2d packages reach Box2D through a shared library built from the
# vendored source in packages/goo2d_ffi_box2d/src. The Build the Box2D shim
# step below compiles it, which is what lets their suites and the example's
# `box2d` tag run here (#202).
name: test

on:
  push:
    branches: [main, master]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `stable`. The pubspecs require flutter >=3.47.0, and a
          # floating channel means a Flutter release can turn CI red on its own
          # schedule with nothing in this repository having changed.
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # Without ffmpeg, two compaction tests skip themselves and the asset
      # pipeline goes untested here. A skip is how coverage disappears quietly,
      # so install it rather than letting the suite report green over a gap.
      # libclang is what ffigen parses the Box2D shim header with, for the
      # bindings check at the end of this job.
      - name: Install ffmpeg and libclang
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libclang-dev

      # goo2d_ffi_box2d, goo2d_physics_box2d and the example's `box2d` tag all
      # open this library through dart:ffi. lib/src/library.dart climbs from
      # the working directory looking for
      # packages/goo2d_ffi_box2d/build/<operating system>, so the build tree
      # goes at build/linux and all three find it from their own package
      # directories. tool/build_native.ps1 runs the same two cmake commands
      # inside a Visual Studio environment for build/windows.
      - name: Build the Box2D shim
        run: |
          set -e
          cmake -S packages/goo2d_ffi_box2d/src \
                -B packages/goo2d_ffi_box2d/build/linux \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build packages/goo2d_ffi_box2d/build/linux --parallel
          # cmake reports success for a build that produced the library under
          # another name; the suites would then fail on a missing library with
          # nothing pointing back here.
          ls -l packages/goo2d_ffi_box2d/build/linux/libgoo2d_box2d.so

      # Resolution is worth its own step. Every package depends on its siblings
      # by hosted `^0.1.0` constraint with a local path override in
      # pubspec_overrides.yaml, and each override has to list the full transitive
      # closure. Get that wrong and version solving fails here rather than in
      # somebody's fresh clone.
      - name: Resolve
        run: |
          set -e
          for p in good goo2d goo3d good_net good_net_p2p goo2d_ffi_box2d goo2d_physics_box2d; do
            echo "::group::flutter pub get $p"
            (cd "packages/$p" && flutter pub get)
            echo "::endgroup::"
          done
          echo "::group::flutter pub get goo2d/example"
          (cd packages/goo2d/example && flutter pub get)
          echo "::endgroup::"
          echo "::group::dart pub get good_cli"
          (cd packages/good_cli && dart pub get)
          echo "::endgroup::"
          echo "::group::flutter pub get doc_snippets"
          (cd packages/doc_snippets && flutter pub get)
          echo "::endgroup::"

      # The fenced dart blocks in docs/, compiled against the real packages, so
      # a rename breaks here rather than being found by a person reading the
      # guide a month later. Extraction writes packages/doc_snippets/lib/pages,
      # which is git-ignored - the check runs on what docs/ says right now, not
      # on a copy that could go stale.
      - name: Compile the doc snippets
        run: |
          set -e
          (cd packages/doc_snippets && dart run tool/extract.dart)
          (cd packages/doc_snippets && flutter analyze --no-pub)

      - name: Analyze
        run: |
          set -e
          for p in good goo2d goo3d good_net good_net_p2p goo2d_ffi_box2d goo2d_physics_box2d; do
            echo "::group::flutter analyze $p"
            (cd "packages/$p" && flutter analyze --no-pub)
            echo "::endgroup::"
          done
          echo "::group::flutter analyze goo2d/example"
          (cd packages/goo2d/example && flutter analyze --no-pub)
          echo "::endgroup::"
          echo "::group::dart analyze good_cli"
          (cd packages/good_cli && dart analyze)
          echo "::endgroup::"

      - name: Test
        run: |
          set -e
          for p in good goo2d goo3d good_net good_net_p2p goo2d_ffi_box2d goo2d_physics_box2d; do
            echo "::group::flutter test $p"
            (cd "packages/$p" && flutter test --no-pub)
            echo "::endgroup::"
          done
          echo "::group::flutter test goo2d/example"
          (cd packages/goo2d/example && flutter test --no-pub)
          echo "::endgroup::"
          echo "::group::dart test good_cli"
          (cd packages/good_cli && dart test)
          echo "::endgroup::"

      # ffigen's function filter is a regex nothing re-runs, so it can stop
      # matching with nothing going red. `good.*` matched none of the shim's 60
      # symbols, and regenerating produced 19 lines - three constants, no
      # `Box2DBindings` class (#201). A test that loads the bindings passes
      # through all of that, because the checked-in file is the correct one.
      # Regenerating is the only thing that sees it.
      #
      # This step is last because ffigen writes over lib/src/box2d.g.dart, which
      # is fine in a throwaway checkout only if no later step reads it.
      - name: Check box2d.g.dart is what ffigen generates
        run: |
          set -e
          # ffigen searches LLVM's own install paths for libclang and its Linux
          # list ends at llvm-15, while libclang-dev on the runner is newer.
          # /usr/lib is on that list, so link whatever apt installed into it.
          sudo ln -sf "$(ls /usr/lib/llvm-*/lib/libclang.so | tail -1)" /usr/lib/libclang.so
          (cd packages/goo2d_ffi_box2d && dart run ffigen --config ffigen.yaml)
          git diff --exit-code -- packages/goo2d_ffi_box2d/lib/src/box2d.g.dart
