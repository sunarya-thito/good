# Runs the analyzer and the test suites on every push and pull request.
#
# packages/goo2d/example is here too, and not as a courtesy: the demos are the
# worked examples the docs point at, so that suite is the closest thing to an
# integration test the repository has. It sat in nobody's baseline and rotted to
# sixteen red tests before anyone noticed (#83), which is what this is for.
#
# The box2d packages reach Box2D through a shared library built from the
# vendored source in packages/goo2d_ffi_box2d/src. The Build the Box2D shim
# step below compiles it, which is what lets their suites and the example's
# `box2d` tag run here (#202).
name: test

on:
  push:
    branches: [main, master]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `stable`. The pubspecs require flutter >=3.47.0, and a
          # floating channel means a Flutter release can turn CI red on its own
          # schedule with nothing in this repository having changed.
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # Without ffmpeg, two compaction tests skip themselves and the asset
      # pipeline goes untested here. A skip is how coverage disappears quietly,
      # so install it rather than letting the suite report green over a gap.
      # libclang is what ffigen parses the Box2D shim header with, for the
      # bindings check at the end of this job.
      - name: Install ffmpeg and libclang
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libclang-dev

      # goo2d_ffi_box2d, goo2d_physics_box2d and the example's `box2d` tag all
      # open this library through dart:ffi. lib/src/library.dart climbs from
      # the working directory looking for
      # packages/goo2d_ffi_box2d/build/<operating system>, so the build tree
      # goes at build/linux and all three find it from their own package
      # directories. tool/build_native.ps1 runs the same two cmake commands
      # inside a Visual Studio environment for build/windows.
      - name: Build the Box2D shim
        run: |
          set -e
          cmake -S packages/goo2d_ffi_box2d/src \
                -B packages/goo2d_ffi_box2d/build/linux \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build packages/goo2d_ffi_box2d/build/linux --parallel
          # cmake reports success for a build that produced the library under
          # another name; the suites would then fail on a missing library with
          # nothing pointing back here.
          ls -l packages/goo2d_ffi_box2d/build/linux/libgoo2d_box2d.so

      # Resolution is worth its own step. Every package depends on its siblings
      # by hosted `^0.1.0` constraint with a local path override in
      # pubspec_overrides.yaml, and each override has to list the full transitive
      # closure. Get that wrong and version solving fails here rather than in
      # somebody's fresh clone.
      - name: Resolve
        run: |
          set -e
          for p in good good_audio_soloud goo2d goo3d good_net good_net_p2p goo2d_ffi_box2d goo2d_physics_box2d; do
            echo "::group::flutter pub get $p"
            (cd "packages/$p" && flutter pub get)
            echo "::endgroup::"
          done
          echo "::group::flutter pub get goo2d/example"
          (cd packages/goo2d/example && flutter pub get)
          echo "::endgroup::"
          echo "::group::dart pub get good_cli"
          (cd packages/good_cli && dart pub get)
          echo "::endgroup::"
          echo "::group::dart pub get good_tool"
          (cd packages/good_tool && dart pub get)
          echo "::endgroup::"
          echo "::group::flutter pub get doc_snippets"
          (cd packages/doc_snippets && flutter pub get)
          echo "::endgroup::"

      # The fenced dart blocks in docs/, compiled against the real packages, so
      # a rename breaks here rather than being found by a person reading the
      # guide a month later. Extraction writes packages/doc_snippets/lib/pages,
      # which is git-ignored - the check runs on what docs/ says right now, not
      # on a copy that could go stale.
      - name: Compile the doc snippets
        run: |
          set -e
          (cd packages/doc_snippets && dart run tool/extract.dart)
          (cd packages/doc_snippets && flutter analyze --no-pub)

      - name: Analyze
        run: |
          set -e
          for p in good good_audio_soloud goo2d goo3d good_net good_net_p2p goo2d_ffi_box2d goo2d_physics_box2d; do
            echo "::group::flutter analyze $p"
            (cd "packages/$p" && flutter analyze --no-pub)
            echo "::endgroup::"
          done
          echo "::group::flutter analyze goo2d/example"
          (cd packages/goo2d/example && flutter analyze --no-pub)
          echo "::endgroup::"
          echo "::group::dart analyze good_cli"
          (cd packages/good_cli && dart analyze)
          echo "::endgroup::"
          echo "::group::dart analyze good_tool"
          (cd packages/good_tool && dart analyze)
          echo "::endgroup::"

      - name: Test
        run: |
          set -e
          for p in good good_audio_soloud goo2d goo3d good_net good_net_p2p goo2d_ffi_box2d goo2d_physics_box2d; do
            echo "::group::flutter test $p"
            (cd "packages/$p" && flutter test --no-pub)
            echo "::endgroup::"
          done
          echo "::group::flutter test goo2d/example"
          (cd packages/goo2d/example && flutter test --no-pub)
          echo "::endgroup::"
          echo "::group::dart test good_cli"
          (cd packages/good_cli && dart test)
          echo "::endgroup::"
          echo "::group::dart test good_tool"
          (cd packages/good_tool && dart test)
          echo "::endgroup::"

      # The accessor properties and the component-bit tables are generated once
      # and committed, because they ship inside good and goo2d - a published
      # package carries what is in its lib/ and nothing runs a build step
      # there. A committed generated file can go stale, and this is the step
      # that says so. Staleness matters more for the bit table than for the
      # properties: a stale table is a numbering two builds do not share, and a
      # signature is only worth sending because they do.
      #
      # `--check` and not "regenerate, then git diff": it reports without
      # writing, so the failure names the file and nothing later in the job
      # reads a tree this step modified. The box2d step below does it the other
      # way round and has to be last for exactly that reason.
      - name: Check the generated files are what good_tool would write
        run: |
          set -e
          (cd packages/good_tool && dart run good_tool --check --dir ../../packages)

      # Doc comments are the published API reference, and nothing resolves the
      # `[Reference]` links in them. `comment_references` reports 97 sites over
      # these packages and 90 of them name something the package declares and
      # the file naming it does not import, which dartdoc resolves through the
      # entry library. This asks the narrower question - a name written nowhere
      # at all - and a reference like that leaves a reader following a link to
      # nothing.
      - name: Check that every doc reference names something
        run: |
          set -e
          (cd packages/good_tool && dart run good_tool --doc-references --dir ../../packages)

      # A declaration is a field with its value on it. The shapes this refuses
      # - `late`, `static`, a top-level variable - each split that in two, and
      # the half that runs does so at a moment nothing at the declaration
      # mentions. None of them is visible at run time: the value arrives, and
      # arrives attributed to whichever owner was under construction when the
      # initialiser finally ran.
      - name: Check that every declaration is held by the field that declares it
        run: |
          set -e
          (cd packages/good_tool && dart run good_tool --declarations --dir ../../packages)

      # ffigen's function filter is a regex nothing re-runs, so it can stop
      # matching with nothing going red. `good.*` matched none of the shim's 60
      # symbols, and regenerating produced 19 lines - three constants, no
      # `Box2DBindings` class (#201). A test that loads the bindings passes
      # through all of that, because the checked-in file is the correct one.
      # Regenerating is the only thing that sees it.
      #
      # This step is last because ffigen writes over lib/src/box2d.g.dart, which
      # is fine in a throwaway checkout only if no later step reads it.
      - name: Check box2d.g.dart is what ffigen generates
        run: |
          set -e
          # ffigen searches LLVM's own install paths for libclang and its Linux
          # list ends at llvm-15, while libclang-dev on the runner is newer.
          # /usr/lib is on that list, so link whatever apt installed into it.
          sudo ln -sf "$(ls /usr/lib/llvm-*/lib/libclang.so | tail -1)" /usr/lib/libclang.so
          (cd packages/goo2d_ffi_box2d && dart run ffigen --config ffigen.yaml)
          git diff --exit-code -- packages/goo2d_ffi_box2d/lib/src/box2d.g.dart

  # Builds the Box2D shim for macOS and iOS. Nothing else here does: the Apple
  # platforms compile through the two podspecs instead of src/CMakeLists.txt,
  # and lib/src/library.dart calls DynamicLibrary.process() on Apple, so no
  # `flutter test` run can reach those symbols. Only an application build links
  # them, which is what this job is.
  #
  # It is a job of its own, so an Xcode build does not sit in front of the
  # signal everyone else waits on, and it runs on every push with no path
  # filter: a filter that stops matching takes the coverage with it and says
  # nothing, which is the shape of the defect this job was written for.
  #
  # The nm step is the one that matters. Before #208 both podspecs named their
  # sources with patterns that reach outside the pod root, CocoaPods matched
  # none of them, and the pod compiled nothing at all - and the application
  # still built, green, with no shim inside it. A build that succeeds is not
  # evidence here; the symbols in the bundle are.
  apple:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # packages/goo2d/example has no macos target and the repository holds no
      # Apple application, so the harness is generated here and thrown away.
      # Debug, because the question is whether the pod compiles and links, and
      # a release build only adds Dart AOT time to the answer.
      - name: Build an application against the plugin
        run: |
          set -e
          HARNESS="$RUNNER_TEMP/apple_harness"
          flutter create --platforms=macos,ios --project-name apple_harness "$HARNESS"
          cd "$HARNESS"
          flutter pub add "goo2d_ffi_box2d:{\"path\":\"$GITHUB_WORKSPACE/packages/goo2d_ffi_box2d\"}"
          echo "::group::flutter build macos"
          flutter build macos --debug
          echo "::endgroup::"
          echo "::group::flutter build ios"
          flutter build ios --debug --no-codesign
          echo "::endgroup::"

      - name: Check the shim reached the application
        run: |
          set -e
          HARNESS="$RUNNER_TEMP/apple_harness"
          status=0
          for platform in macos ios; do
            case "$platform" in
              macos) app="$HARNESS/build/macos/Build/Products/Debug/apple_harness.app" ;;
              ios)   app="$HARNESS/build/ios/iphoneos/Runner.app" ;;
            esac

            test -d "$app" || {
              echo "::error::$platform: $app was not built"
              exit 1
            }

            # -exec ... + and not xargs: the bundle holds enough files to
            # overrun the argument limit, and xargs answers that by dropping
            # the ones it could not fit. An incomplete scan reports the same
            # absence as a missing symbol.
            #
            # `exit 0` because the loop's status is grep's answer about the
            # last file it saw, find passes that on, and under `set -e` an
            # ordinary non-Mach-O file at the end of the bundle would end the
            # step with nothing printed.
            binaries=$(find "$app" -type f -exec sh -c '
              for file; do
                file -b "$file" | grep -q Mach-O && echo "$file"
              done
              exit 0' _ {} +)
            symbols=$(echo "$binaries" | while IFS= read -r file; do
              nm -gU "$file" 2>/dev/null || true
            done | awk '{print $NF}' | sort -u)

            echo "$platform: $(echo "$binaries" | wc -l) Mach-O files, $(echo "$symbols" | wc -l) symbols defined"
            echo "$binaries" | while IFS= read -r file; do
              nm -gU "$file" 2>/dev/null | grep -q ' _gooB2Version$'                 && echo "$platform: the shim is in ${file#"$app"/}"
            done || true

            # _main is the control. It is in the application binary whatever
            # the plugin does, so its absence means the scan read nothing and
            # the two results below are worth nothing either.
            for symbol in _main _gooB2Version; do
              if echo "$symbols" | grep -qx "$symbol"; then
                echo "$platform: $symbol defined"
              else
                echo "::error::$platform: $symbol is not defined in the application bundle"
                status=1
              fi
            done
          done
          exit $status
