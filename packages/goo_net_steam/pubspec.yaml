name: goo_net_steam
description: >
  Steam backend for goo_net: lobbies via ISteamMatchmaking, P2P via
  ISteamNetworkingSockets (with Valve's relay network as a free fallback).
  Phase 3 of the project root plan; this package is currently a placeholder.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.1

dependencies:
  goo_net:
    path: ../goo_net
  goo_ffi_steamworks:
    path: ../goo_ffi_steamworks

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
