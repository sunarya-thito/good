name: good
description: >-
  Dimension-agnostic game engine kernel for Flutter: an ECS, native memory
  pools and ring buffers, scenes, a fixed-tick simulation isolate,
  hierarchy, assets and the GameView widget.
version: 0.3.0-dev
repository: https://github.com/sunarya-thito/good
homepage: https://sunarya-thito.github.io/good/
documentation: https://sunarya-thito.github.io/good/
issue_tracker: https://github.com/sunarya-thito/good/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  archive: ^3.6.1
  cryptography: ^2.7.0
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  gamepads: ^0.1.10+5
  meta: ^1.15.0
  # Vec2Binding composes four keys into a Vector2, so the declarative input
  # system needs a vector type in the kernel. vector_math_64 (Float64List
  # storage) rather than vector_math, to match the float64 component fields
  # Transform2D already uses - a Vector2 read out of an input and added to
  # transformOffsetX must not silently round-trip through 32 bits.
  vector_math: ^2.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
