# The repository's own code generator. Never published, and never a dependency
# of anything a user installs - that is the whole reason it is not a flag on
# good_cli (#300). What it writes is committed into packages/*/lib/, so a user
# gets the generated code by importing the engine.
name: good_tool
description: >-
  Development-time code generation for this repository: the files that are
  generated once and shipped inside the engine packages.
publish_to: "none"
version: 0.0.0

environment:
  sdk: ^3.12.1

dependencies:
  # The doc-reference check parses on its own: what it reads is the token
  # stream and the doc comments hanging off it, and `readSources` keeps
  # neither. The constraints match good_cli's, so one resolution serves both.
  #
  # Floor 10.0.0: 7.x does not implement primary constructors at any
  # `enable-experiment` spelling, and three files in packages/*/lib use them.
  # `parseString` recovered instead of failing, so both check modes reported
  # clean runs over trees they had read a fraction of (#348). 9.0.0 parses the
  # syntax under the name `declaring-constructors`; 10.0.0 is the first that
  # takes `primary-constructors`, which is what the analysis_options files say.
  #
  # Ceiling 11.0.0: that major drops `ClassDeclaration.name`, `.members` and
  # the rest of the pre-`ClassBody` AST, which is what both packages read. The
  # bump past it is a migration to `namePart`/`body`, not a constraint edit.
  analyzer: ">=10.0.0 <11.0.0"
  # A path dependency, not the hosted-constraint-plus-override pattern the
  # published packages use. This one is never resolved from pub.dev by anybody,
  # so the indirection would buy nothing.
  #
  # good_cli is here for `readSources`: the parse of every declaration in the
  # repository, and the marking that decides which mixins end up on a
  # Component. Its shadowed-field check asks different questions of the same
  # trees, and one walk answering both is why that lives there and not here.
  good_cli:
    path: ../good_cli
  meta: ^1.15.0
  path: ^1.9.0
  pub_semver: ^2.1.4

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

executables:
  good_tool: good_tool
