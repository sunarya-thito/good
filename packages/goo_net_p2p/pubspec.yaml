name: goo_net_p2p
description: >
  Serverless P2P backend for goo_net: UDP hole punching against free public
  STUN servers, a default goo-hosted free rendezvous relay for
  discovery/signaling (nothing for the game developer to host), and a
  lightweight custom reliable/unreliable UDP data channel. Phase 3 of the
  project root plan; this package is currently a placeholder.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.1

dependencies:
  goo_net:
    path: ../goo_net

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
