name: goo
description: >
  Dimension-agnostic engine kernel for the goo game engine family: the ECS
  (Entity/Component/System/Query/Event), the shared native memory pool and
  ring buffers, scenes, the fixed-tick loop, hierarchy, the generic asset
  registry, and the GameView widget every renderer plugs into. Depends on
  Flutter (StateChannel is a ValueListenable, and GameView is a widget), but
  on nothing dimension-specific - goo2d/goo3d supply the actual renderers.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  archive: ^3.6.1
  cryptography: ^2.7.0
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  gamepads: ^0.1.10+5
  meta: ^1.15.0
  # Vec2Binding composes four keys into a Vector2, so the declarative input
  # system needs a vector type in the kernel. vector_math_64 (Float64List
  # storage) rather than vector_math, to match the float64 component fields
  # Transform2D already uses - a Vector2 read out of an input and added to
  # transformOffsetX must not silently round-trip through 32 bits.
  vector_math: ^2.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
