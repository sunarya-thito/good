name: goo2d_physics_box2d
description: >-
  2D physics for the good game engine: bodies, colliders, all nine joints,
  effectors, and raycast and overlap queries, stepped in the game isolate
  and solved across threads.
version: 0.2.0
repository: https://github.com/sunarya-thito/good
homepage: https://sunarya-thito.github.io/good/
documentation: https://sunarya-thito.github.io/good/
issue_tracker: https://github.com/sunarya-thito/good/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  # Direct, because the scratch buffers handed to the shim are calloc'd
  # Pointers - not merely re-exported from goo2d_ffi_box2d.
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  goo2d: ^0.2.0
  goo2d_ffi_box2d: ^0.1.0
  meta: ^1.15.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
