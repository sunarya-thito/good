name: goo2d_physics_box2d
description: >
  ECS-facing Box2D physics for goo2d: RigidBody2D/Collider2D components and
  Box2DPhysicsSystem, built on goo2d_ffi_box2d. Phase 2 of the project root
  plan; this package is currently a placeholder.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.1

dependencies:
  goo:
    path: ../goo
  goo2d:
    path: ../goo2d
  goo2d_ffi_box2d:
    path: ../goo2d_ffi_box2d

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
