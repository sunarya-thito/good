name: good_cli
description: >
  The `good` build tool: asset packing/encryption, compile-time codegen for
  ECS struct layouts, and platform build/packaging orchestration.
  Dimension-agnostic - goo2d_render (and later goo3d_render) register their
  own asset types into the same pipeline. Phase 4 of the project root plan;
  this package is currently a placeholder.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.1

dependencies:
  meta: ^1.15.0
  path: ^1.9.0
  yaml: ^3.1.2
  analyzer: ^7.4.0
  archive: ^3.6.1
  crypto: ^3.0.6
  cryptography: ^2.7.0
  args: ^2.6.0
  good:
    path: ../good

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

executables:
  good: good
