name: goo_ffi_steamworks
description: >
  Raw ffigen bindings to Steamworks' steam_api_flat.h. Kept separate from
  goo_net_steam's ergonomic API so bindings can be regenerated independently.
  The Steamworks SDK itself is not redistributed here (Valve's EULA) -
  consumers fetch it themselves. Phase 3 of the project root plan; this
  package is currently a placeholder.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.1

dependencies:
  ffi: ^2.2.0

dev_dependencies:
  ffigen: ^18.0.0
  lints: ^5.0.0
  test: ^1.25.0
