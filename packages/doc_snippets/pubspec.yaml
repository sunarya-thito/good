name: doc_snippets
description: >-
  Compiles the fenced dart blocks in docs/ against the real engine packages, so
  renaming a public name breaks the build at the documentation that still uses
  the old one. Not published; lib/ is generated by tool/extract.dart.
version: 0.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Every package a doc page can reasonably import. A snippet only compiles if the
# symbols it names exist here, which is the whole point, so the list has to cover
# the packages the guide actually teaches.
dependencies:
  flutter:
    sdk: flutter
  good: ^0.3.0-dev
  good_audio_soloud: ^0.1.0-dev
  goo2d: ^0.3.0-dev
  goo2d_physics_box2d: ^0.3.0-dev
  goo3d: ^0.3.0-dev
  good_net: ^0.4.0-dev
  good_net_p2p: ^0.4.0-dev
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
