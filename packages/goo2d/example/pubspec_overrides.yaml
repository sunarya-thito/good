# Local development resolves sibling packages from this repository instead
# of pub.dev. This is the full transitive closure: resolving one sibling by
# path pulls in ITS hosted constraints too, which do not exist yet.
# Excluded from published archives by .pubignore.
dependency_overrides:
  goo2d:
    path: ../../goo2d
  goo2d_physics_box2d:
    path: ../../goo2d_physics_box2d
  goo2d_ffi_box2d:
    path: ../../goo2d_ffi_box2d
  good:
    path: ../../good
