# Declared so the runner does not warn about an unrecognised tag, and so the
# reason it exists is written down next to it.
#
# `box2d`: needs the goo2d_ffi_box2d native library. CI builds it and runs the
# whole suite (#202); the tag names the cases to leave out with
# `--exclude-tags box2d` in a checkout where the library has not been built.
tags:
  box2d:
