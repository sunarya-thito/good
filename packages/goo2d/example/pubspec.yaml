name: goo2d_example
description: "Verification example for goo2d."
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  goo2d:
    path: ../
  # The physics backend is opt-in, so the example adds it explicitly -
  # exactly as a real game would. Pulling it in also means `flutter test`
  # here needs the native library built; see goo2d_ffi_box2d's README.
  goo2d_physics_box2d:
    path: ../../goo2d_physics_box2d

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Bundles the MaterialIcons font. Without this the widgets are all correct
  # and every icon still renders as tofu, because the glyph is simply not in
  # the build - which reads as a font problem rather than a missing flag.
  uses-material-design: true
