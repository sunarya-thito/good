name: goo2d_ffi_box2d
description: >
  Raw ffigen bindings to Box2D v3's C API, plus prebuilt per-platform
  binaries. Kept separate from goo2d_physics_box2d's ECS-facing API so
  bindings can be regenerated independently. Phase 2 of the project root
  plan; this package is currently a placeholder.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.1

dependencies:
  ffi: ^2.2.0

dev_dependencies:
  ffigen: ^18.0.0
  lints: ^5.0.0
  test: ^1.25.0
