name: goo2d_ffi_box2d
description: >-
  Raw FFI bindings to Box2D v3.1.1 for the good game engine, with a vendored
  C shim and a worker-thread pool. Use goo2d_physics_box2d for the ECS-
  facing API instead.
version: 0.1.2-dev
repository: https://github.com/sunarya-thito/good
homepage: https://sunarya-thito.github.io/good/
documentation: https://sunarya-thito.github.io/good/
issue_tracker: https://github.com/sunarya-thito/good/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  ffigen: ^18.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    # ffiPlugin: true on every platform - this package contributes no
    # Dart-side plugin class and no platform channel, only a native library
    # that Flutter's build must compile and bundle. Windows, Linux and
    # Android reach src/CMakeLists.txt through their own thin wrapper;
    # macOS and iOS go through the podspecs.
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
