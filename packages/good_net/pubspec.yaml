name: good_net
description: >-
  Networking for the good game engine: declared messages built on good's
  record layer, sessions, reliable and unreliable channels, and the
  transport contract a backend implements.
version: 0.2.1
repository: https://github.com/sunarya-thito/good
homepage: https://sunarya-thito.github.io/good/
documentation: https://sunarya-thito.github.io/good/
issue_tracker: https://github.com/sunarya-thito/good/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  # The conformance suite in lib/testing.dart is library code, not test code:
  # backends live in their own packages and a test directory is not importable
  # across packages, so the suite ships where a backend can reach it. That is
  # what puts flutter_test here rather than below.
  flutter_test:
    sdk: flutter
  # A network message and a command are the same record on two different
  # wires, so the layout, the descriptor vocabulary and the pointer types all
  # come from the kernel rather than being written a second time here. See
  # good's `ParamBatch`.
  good: ^0.2.0
  meta: ^1.15.0

dev_dependencies:
  flutter_lints: ^6.0.0
