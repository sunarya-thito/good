site_name: good
site_description: >-
  An ECS game engine for Flutter and Dart: the good kernel, and the 2D and 3D
  engines built on it.
site_url: https://sunarya-thito.github.io/good/
repo_url: https://github.com/sunarya-thito/good
repo_name: sunarya-thito/good
edit_uri: edit/master/docs/

# A link to a heading that no longer exists is a broken link, and mkdocs only
# reports it as INFO by default - which `--strict` does not fail on. Renaming a
# heading silently broke a cross-reference exactly once; this makes it fail CI.
validation:
  anchors: warn
  links:
    absolute_links: info
    unrecognized_links: warn
copyright: Built with good.

docs_dir: docs
site_dir: site

# These live in docs/ next to what uses them, but they are not pages: the CI pin,
# and the abbreviation list every page appends.
exclude_docs: |
  requirements.txt
  includes/

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # Required for Material's icon shortcodes. Without it `:material-cube-outline:`
  # is left as literal text on the page instead of becoming an inline SVG.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  # Every page gets the abbreviation list appended, so a reader hovering over
  # "prefab" or "isolate" gets a one-line definition without the prose having to
  # stop and explain itself. Defined once in docs/includes/abbreviations.md.
  - pymdownx.snippets:
      base_path: [docs]
      auto_append: [includes/abbreviations.md]
  # `format: mermaid` routes ```mermaid blocks to Material's bundled Mermaid,
  # so diagrams are text in the source and SVG on the page. No extra plugin and
  # no build step; Material loads mermaid.js itself and themes it to match.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Create a project: getting-started/create-a-project.md
      - Your first game: getting-started/your-first-game.md
  - 2D and 3D: packages/2d-and-3d.md
  - Developing a game:
      - guide/index.md
      - Coming from Unity/Godot: guide/mental-model.md
      - Thinking in ECS: guide/thinking-in-ecs.md
      - Architecture: guide/architecture.md
      - Entities and components: guide/entities-and-components.md
      - Scenes and prefabs: guide/scenes.md
      - Systems and queries: guide/systems-and-queries.md
      - Events and listeners: guide/events.md
      - Input: guide/input.md
      - Assets: guide/assets.md
      - Talking to Flutter: guide/flutter-bridge.md
      - Coroutines and animation: guide/coroutines-and-animation.md
      - Performance: guide/performance.md
  - Building in 2D:
      - Transforms and hierarchy: guide/transforms-and-hierarchy.md
      - Rendering and cameras: guide/rendering.md
      - Physics: guide/physics.md
  - Building in 3D:
      - Transforms and hierarchy: guide/3d/transforms.md
      - Rendering and cameras: guide/3d/rendering.md
      - Physics: guide/3d/physics.md
  - Exporting a game:
      - exporting/index.md
      - The asset pipeline: exporting/asset-pipeline.md
      - Building for a platform: exporting/building.md
      - Troubleshooting: exporting/troubleshooting.md
  - The packages:
      - packages/index.md
      - Networking: packages/networking.md
  - Reference:
      - CLI: reference/cli.md
      - Hot-path rules: reference/rules.md
      - Engine design rules: reference/design-rules.md
      - Roadmap and status: reference/roadmap.md
